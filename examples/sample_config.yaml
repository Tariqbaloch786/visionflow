source: "0"   # webcam; replace with a path or RTSP URL

detector:
  weights: yolov8n.pt
  conf: 0.30
  iou: 0.45
  classes: [0, 1, 2, 3, 5, 7]   # COCO: person, bicycle, car, motorbike, bus, truck
  imgsz: 640
  device: cpu

tracker:
  iou_threshold: 0.30
  max_age: 30
  min_hits: 3

lines:
  - name: north
    start: [0, 400]
    end: [1280, 400]

speed:
  enabled: false
  image_quad:
    - [560, 360]
    - [720, 360]
    - [900, 600]
    - [380, 600]
  world_size_m: [3.5, 12.0]
  fps: 30.0
  smoothing: 5

heatmap:
  enabled: true
  decay: 0.92
  radius: 25
  alpha: 0.45

output:
  video: outputs/run.mp4
  csv: outputs/tracks.csv
  show: true

log_level: INFO
