source: "0"   # webcam; replace with a path or RTSP URL

# Primary detector: IISc UVH-26 (YOLOv11-S fine-tuned on Indian traffic).
# 14 vehicle classes including Three-wheeler (auto rickshaw), Bus, Truck,
# Two-wheeler, Bicycle, Hatchback/Sedan/SUV/MUV/Van/LCV/Mini-bus/Tempo-traveller.
# Run `python scripts/download_models.py` once to fetch the weights.
detector:
  weights: models/uvh26.pt
  conf: 0.30
  iou: 0.45
  classes: null         # keep all 14 vehicle classes
  imgsz: 640
  device: cpu           # set to "0" if you have a CUDA GPU

# Secondary detector: stock COCO YOLOv8n, restricted to person (class 0).
# UVH-26 is vehicles-only, so this is what gives you pedestrian detection.
# Remove this block if you don't need pedestrians (saves ~one inference per frame).
secondary_detector:
  weights: yolov8n.pt
  conf: 0.30
  iou: 0.45
  classes: [0]          # COCO: person only
  imgsz: 640
  device: cpu

tracker:
  iou_threshold: 0.30
  max_age: 30
  min_hits: 3

lines:
  - name: north
    start: [0, 400]
    end: [1280, 400]

speed:
  enabled: false
  image_quad:
    - [560, 360]
    - [720, 360]
    - [900, 600]
    - [380, 600]
  world_size_m: [3.5, 12.0]
  fps: 30.0
  smoothing: 5

heatmap:
  enabled: true
  decay: 0.92
  radius: 25
  alpha: 0.45

output:
  video: outputs/run.mp4
  csv: outputs/tracks.csv
  show: true

log_level: INFO
