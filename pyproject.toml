[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionflow"
version = "0.1.0"
description = "Real-time multi-object tracking and traffic analytics pipeline (detection, tracking, speed estimation, zone counting, heatmaps)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tariq" }]
keywords = [
    "computer-vision",
    "object-detection",
    "object-tracking",
    "multi-object-tracking",
    "yolo",
    "yolov8",
    "traffic-analysis",
    "vehicle-detection",
    "pedestrian-detection",
    "speed-estimation",
    "heatmap",
    "video-analytics",
    "opencv",
    "ultralytics",
    "real-time",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "ultralytics>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.18", "pandas>=2.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
]

[project.scripts]
visionflow = "visionflow.cli:app"

[project.urls]
Homepage = "https://github.com/Tariqbaloch786/visionflow"
Issues = "https://github.com/Tariqbaloch786/visionflow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501", "N806"]

[tool.ruff.lint.per-file-ignores]
"src/visionflow/cli.py" = ["B008"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
